services:
  - type: web
    name: btc-trading-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd bot && gunicorn flask_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: UPBIT_ACCESS_KEY
        sync: false
      - key: UPBIT_SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TRADING_MODE
        value: LIVE

