name: 🤖 BTC Trading Bot

on:

  
  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading Mode'
        required: false
        default: 'LIVE'
        type: choice
        options:
          - LIVE
          - SIMULATION

jobs:
  trading:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub에 결과 저장용
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🤖 Run Trading Bot
        env:
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_MODE: ${{ github.event.inputs.mode || 'LIVE' }}
        run: |
          cd bot
          python trading_bot.py
      
      - name: 📊 Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # data 디렉토리 확인 및 생성
          mkdir -p data
          
          # 변경사항이 있으면 커밋
          if [ -n "$(git status --porcelain)" ]; then
            git add data/*.json 2>/dev/null || true
            git commit -m "🤖 Auto-trading results: $(date +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
            git push || exit 0
          else
            echo "No changes to commit"
          fi
      
      - name: 📈 Generate Summary
        if: always()
        run: |
          echo "## 📊 Trading Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏰ 실행 시간: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "data/portfolio.json" ]; then
            echo "### 💼 Portfolio" >> $GITHUB_STEP_SUMMARY
            cat data/portfolio.json | python3 -m json.tool >> $GITHUB_STEP_SUMMARY || echo "데이터 없음" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ 완료! 자세한 로그는 위를 확인하세요." >> $GITHUB_STEP_SUMMARY
